name: Publish NuGet package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore CLIApp.csproj

      - name: Build
        run: msbuild CLIApp.csproj /p:Configuration=Release

      - name: Create NuGet package
        run: nuget pack mcCLIApp.nuspec -OutputDirectory packages

      - name: Publish to NuGet
        run: nuget push "packages\*.nupkg" -Source https://api.nuget.org/v3/index.json
